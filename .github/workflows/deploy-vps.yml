name: Deploy VPS

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: bao-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Activate repository pnpm
        run: corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter='!@bao/client' build

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bao-vps
          chmod 600 ~/.ssh/bao-vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy develop
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh \
            -i ~/.ssh/bao-vps \
            "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' BRANCH=develop '$VPS_APP_DIR/infra/vps/deploy.sh'"
