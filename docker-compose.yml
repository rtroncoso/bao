services:
  mysql:
    image: mysql:8.4
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bao}
    volumes:
      - bao_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  bao_mysql_data:
